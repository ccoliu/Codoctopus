# Place at: Codoctopus/.github/workflows/ci.yml
# Requires the ruff rule pin in pyproject.toml (see codoctopus-lint-fix.patch).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check codoctopus tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with all providers
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]" pytest-cov

      # Providers are exercised with scripted fakes, so no API keys are needed.
      - name: Run tests with coverage
        run: pytest -q --cov=codoctopus --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
