name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a rule change landing in Coworkify (checked out below) is
  # caught by the parity tests even if nothing in this repo changed.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check codoctopus tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # Coworkify's own DAG validator, so the parity tests in
      # test_planning_validate.py run here instead of skipping.
      - uses: actions/checkout@v4
        with:
          repository: ccoliu/coworkify
          path: coworkify

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            coworkify/requirements.txt

      - name: Install package with all providers
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]" pytest-cov
          pip install -r coworkify/requirements.txt

      # Providers are exercised with scripted fakes, so no API keys are needed.
      # Coworkify's schema module imports its DB layer, which refuses to load
      # without DATABASE_URL; nothing ever connects, so a placeholder is enough.
      - name: Run tests with coverage
        env:
          COWORKIFY_PATH: ${{ github.workspace }}/coworkify
          DATABASE_URL: postgresql://ci:ci@localhost:5432/unused
        run: pytest -q --cov=codoctopus --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
